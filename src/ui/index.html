<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>KeyRouter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karla:wght@300..800&display=swap">
<style>
@font-face { font-family: "LT Panneaux"; font-style: normal; font-weight: 600; font-display: swap; src: local("LT Panneaux SemiBold"), url("https://fonts.cdnfonts.com/s/110270/LTPanneaux-SemiBold.woff") format("woff"); }
@font-face { font-family: "LT Panneaux"; font-style: normal; font-weight: 700; font-display: swap; src: local("LT Panneaux Bold"), url("https://fonts.cdnfonts.com/s/110270/LTPanneaux-Bold.woff") format("woff"); }

/* ---------- tokens ---------- */
:root {
  --bg: #f6f0e9;
  --card: #ffffff;
  --ink: #1c1c1e;
  --ink2: #5f5f64;
  --ink3: #9a9aa0;
  --line: rgba(28, 28, 30, 0.08);
  --line2: rgba(28, 28, 30, 0.14);
  --fill: #f4efe9;
  --fill-hover: #ebe4dc;
  /* 60/30/10: warm neutrals (60), charcoal (30), one accent (10). The accent is set in Settings. */
  --accent: #ff6a13;
  --accent-ink: #c24a00;
  --accent-soft: #fff0e5;
  --accent-ring: rgba(255, 106, 19, 0.16);
  --on-accent: #ffffff;
  /* status colors, used only with an icon or a word */
  --good: #1f9d55;
  --good-ink: #17703d;
  --good-soft: #e7f5ec;
  --warn: #c98a00;
  --warn-ink: #8a5a00;
  --warn-soft: #fbf1d9;
  --red: #e5484d;
  --red-ink: #b42318;
  --red-soft: #fdeceb;
  --side: #fffdfb;
  --side-strong: #1c1c1e;
  --side-fg: #5f5f64;
  --side-hover: #f4efe9;
  --tile: #1c1c1e;
  --tile-2: #2c2c2e;
  --btn-bg: #1c1c1e;
  --btn-fg: #ffffff;
  --input: #ffffff;
  --seg-on: #ffffff;
  --nav-on: #1c1c1e;
  --nav-on-fg: #ffffff;
  --track-bar: #efe8e0;
  --scrim: rgba(28, 28, 30, 0.3);
  --scroll: rgba(28, 28, 30, 0.2);
  --pop: 0 1px 2px rgba(28, 28, 30, 0.06), 0 16px 44px rgba(28, 28, 30, 0.16);
  color-scheme: light;
  --shadow: 0 1px 2px rgba(28, 28, 30, 0.04), 0 8px 28px rgba(28, 28, 30, 0.05);
  --shadow-lg: 0 24px 70px rgba(28, 28, 30, 0.22);
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  --font: "Karla", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --head: "LT Panneaux", "Karla", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
}
:root[data-theme=dark] {
  --bg: #0e0e10; --card: #19191c; --ink: #f5f5f7; --ink2: #a6a6ab; --ink3: #6e6e73;
  --line: rgba(255, 255, 255, 0.07); --line2: rgba(255, 255, 255, 0.13); --fill: #242428; --fill-hover: #2e2e33;
  --accent: #ff7424; --accent-ink: #ff9d61; --accent-soft: rgba(255, 116, 36, 0.15); --accent-ring: rgba(255, 116, 36, 0.28); --on-accent: #ffffff;
  --good: #3ecf7a; --good-ink: #62db95; --good-soft: rgba(62, 207, 122, 0.13); --warn: #e8b44a; --warn-ink: #f0c56e; --warn-soft: rgba(232, 180, 74, 0.14);
  --red: #ff6b6f; --red-ink: #ff8a8d; --red-soft: rgba(229, 72, 77, 0.16);
  --side: #000000; --side-strong: #ffffff; --side-fg: #a6a6ab; --side-hover: rgba(255, 255, 255, 0.07);
  --tile: #242428; --tile-2: #2c2c30; --btn-bg: #f5f5f7; --btn-fg: #111113; --input: #131316; --seg-on: #3a3a3f;
  --nav-on: #f5f5f7; --nav-on-fg: #111113; --track-bar: #222226; --scrim: rgba(0, 0, 0, 0.55);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 28px rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 24px 70px rgba(0, 0, 0, 0.6);
  --scroll: rgba(255, 255, 255, 0.2); --pop: 0 1px 2px rgba(0, 0, 0, 0.5), 0 16px 44px rgba(0, 0, 0, 0.55); color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme=light]) {
    --bg: #0e0e10; --card: #19191c; --ink: #f5f5f7; --ink2: #a6a6ab; --ink3: #6e6e73;
    --line: rgba(255, 255, 255, 0.07); --line2: rgba(255, 255, 255, 0.13); --fill: #242428; --fill-hover: #2e2e33;
    --accent: #ff7424; --accent-ink: #ff9d61; --accent-soft: rgba(255, 116, 36, 0.15); --accent-ring: rgba(255, 116, 36, 0.28); --on-accent: #ffffff;
    --good: #3ecf7a; --good-ink: #62db95; --good-soft: rgba(62, 207, 122, 0.13); --warn: #e8b44a; --warn-ink: #f0c56e; --warn-soft: rgba(232, 180, 74, 0.14);
    --red: #ff6b6f; --red-ink: #ff8a8d; --red-soft: rgba(229, 72, 77, 0.16);
    --side: #000000; --side-strong: #ffffff; --side-fg: #a6a6ab; --side-hover: rgba(255, 255, 255, 0.07);
    --tile: #242428; --tile-2: #2c2c30; --btn-bg: #f5f5f7; --btn-fg: #111113; --input: #131316; --seg-on: #3a3a3f;
    --nav-on: #f5f5f7; --nav-on-fg: #111113; --track-bar: #222226; --scrim: rgba(0, 0, 0, 0.55);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 28px rgba(0, 0, 0, 0.35);
    --shadow-lg: 0 24px 70px rgba(0, 0, 0, 0.6);
    --scroll: rgba(255, 255, 255, 0.2); --pop: 0 1px 2px rgba(0, 0, 0, 0.5), 0 16px 44px rgba(0, 0, 0, 0.55); color-scheme: dark;
  }
}

/* ---------- base ---------- */
* { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--scroll) transparent; }
input[type=number] { -moz-appearance: textfield; appearance: textfield; }
input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type=search]::-webkit-search-cancel-button, input[type=search]::-webkit-search-decoration { -webkit-appearance: none; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; transition: background-color 240ms ease; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, .brand, .kpi .big, .stat .v, .sheet-head h2, .modal h2 { font-family: var(--head); }
.num, .kpi .big, td.n, .meter-lbl, .stat .v { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.muted { color: var(--ink2); }
.faint { color: var(--ink3); }
.err { color: var(--red-ink); }
a { color: var(--accent-ink); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: none; }

/* ---------- shell ---------- */
/* The rail keeps every icon at the same spot while it opens or closes: only its width moves,
   so nothing jumps. Labels fade out as they are clipped. */
.shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; transition: grid-template-columns 380ms var(--ease-out); }
.shell.mini { grid-template-columns: 88px minmax(0, 1fr); }
.side { background: var(--side); color: var(--side-strong); box-shadow: inset -1px 0 0 var(--line); padding: 24px 20px; display: flex; flex-direction: column; gap: 6px; position: sticky; top: 0; height: 100vh; min-width: 0; overflow: hidden; z-index: 20; }
.brand { position: relative; display: flex; align-items: flex-start; gap: 12px; height: 56px; padding-left: 8px; font-weight: 700; font-size: 20px; letter-spacing: -0.01em; flex-shrink: 0; transition: height 380ms var(--ease-out); }
.brand .logo { margin-top: 2px; }
.brand-name { white-space: nowrap; line-height: 36px; transition: opacity 220ms ease; }
.side-fold { position: absolute; top: 0; left: 172px; width: 36px; height: 36px; border-radius: 999px; border: 0; background: none; color: var(--side-fg); display: grid; place-items: center; cursor: pointer; transition: left 380ms var(--ease-out), top 380ms var(--ease-out), background-color 180ms ease, color 180ms ease; }
.side-fold svg { width: 19px; height: 19px; transition: transform 380ms var(--ease-out); }
@media (hover: hover) { .side-fold:hover { background: var(--side-hover); color: var(--side-strong); } }
.logo { width: 32px; height: 32px; border-radius: 10px; background: var(--accent); display: grid; place-items: center; flex-shrink: 0; }
.logo svg { width: 18px; height: 18px; stroke: var(--on-accent); }
.nav-btn { display: flex; align-items: center; gap: 14px; width: 100%; height: 48px; min-height: 48px; flex-shrink: 0; padding: 0 14px; border-radius: 999px; border: 0; background: none; color: var(--side-fg); cursor: pointer; text-align: left; font-weight: 600; overflow: hidden; box-shadow: inset 0 0 0 1px transparent; transition: background-color 180ms ease, color 180ms ease, box-shadow 300ms ease, transform 160ms var(--ease-out); }
.nav-btn svg { width: 20px; height: 20px; flex-shrink: 0; }
.nav-btn span { white-space: nowrap; transition: opacity 200ms ease 60ms; }
.nav-btn:active { transform: scale(0.96); }
.nav-btn.on { background: var(--nav-on); color: var(--nav-on-fg); }
.nav-btn.on svg { stroke: var(--accent); }
@media (hover: hover) { .nav-btn:not(.on):hover { color: var(--side-strong); background: var(--side-hover); } }
.side .grow { flex: 1; }
.side-foot { border-top: 1px solid var(--line); padding-top: 16px; display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
.side-mode { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 20px; background: var(--side-hover); font-size: 13px; color: var(--side-fg); white-space: nowrap; overflow: hidden; max-height: 72px; margin-bottom: 6px; transition: max-height 380ms var(--ease-out), padding 380ms var(--ease-out), margin 380ms var(--ease-out), opacity 200ms ease; }
.side-mode b { display: block; color: var(--side-strong); font-weight: 700; font-size: 14px; }
.mode-dot { width: 8px; height: 8px; border-radius: 999px; flex-shrink: 0; background: var(--good); }
.mode-dot.mixed { background: var(--accent); }
.mode-dot.best { background: var(--ink); }
/* collapsed: a narrow rail of round buttons, labels as tooltips */
.shell.mini .brand { height: 104px; }
.shell.mini .brand-name, .shell.mini .nav-btn span { opacity: 0; transition: opacity 120ms ease; }
.shell.mini .side-fold { position: absolute; left: 6px; top: 50px; }
.shell.mini .nav-btn:not(.on) { box-shadow: inset 0 0 0 1px var(--line); }
.shell.mini .side-mode { max-height: 0; padding-top: 0; padding-bottom: 0; margin-bottom: 0; opacity: 0; }
.side [data-tip] { position: relative; overflow: visible; }
.side .nav-btn[data-tip] { overflow: hidden; }
.rtip { position: fixed; z-index: 60; background: var(--tile); color: #fff; font-size: 12.5px; font-weight: 600; padding: 6px 12px; border-radius: 999px; white-space: nowrap; pointer-events: none; opacity: 0; transform: translate(-4px, -50%); transition: opacity 140ms ease, transform 200ms var(--ease-out); }
.rtip.on { opacity: 1; transform: translate(0, -50%); }
.mtop { display: none; }
.main { padding: 36px 44px 72px; min-width: 0; max-width: 1480px; width: 100%; }
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
.top h1 { margin: 0; font-size: 36px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.05; }
.top p { margin: 8px 0 0; color: var(--ink2); font-size: 15px; max-width: 640px; }
.top .actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }

/* ---------- enter motion (first render only) ---------- */
.enter > *, .enter .grid > * { animation: rise 460ms var(--ease-out) both; }
.enter > *:nth-child(2), .enter .grid > *:nth-child(2) { animation-delay: 50ms; }
.enter > *:nth-child(3), .enter .grid > *:nth-child(3) { animation-delay: 100ms; }
.enter > *:nth-child(4), .enter .grid > *:nth-child(4) { animation-delay: 150ms; }
.enter > *:nth-child(n+5), .enter .grid > *:nth-child(n+5) { animation-delay: 200ms; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* ---------- layout ---------- */
.card { background: var(--card); border-radius: 26px; box-shadow: var(--shadow); padding: 24px; min-width: 0; }
.card h3 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.005em; line-height: 1.2; }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
.card-head .sub { font-size: 13px; color: var(--ink3); margin-top: 4px; }
.grid { display: grid; gap: 20px; }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g21 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.mt { margin-top: 20px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row.nowrap { flex-wrap: nowrap; }
.sp { flex: 1; }
.section-label { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink3); display: flex; align-items: center; gap: 8px; }
.section-label .count { background: var(--fill); color: var(--ink2); border-radius: 999px; padding: 1px 8px; letter-spacing: 0; }

/* ---------- KPI tiles ---------- */
.kpi { position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 8px; min-height: 156px; }
.kpi .lbl { font-size: 14px; font-weight: 600; color: var(--ink2); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.kpi .ic { width: 36px; height: 36px; border-radius: 999px; display: grid; place-items: center; background: var(--fill); flex-shrink: 0; }
.kpi .ic svg { width: 17px; height: 17px; }
.kpi .big { font-size: 40px; font-weight: 700; letter-spacing: -0.01em; line-height: 1; margin-top: auto; }
.kpi .big small { font-size: 20px; font-weight: 600; opacity: 0.6; margin-left: 4px; }
.kpi .foot { font-size: 13px; color: var(--ink2); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.kpi.orange { background: var(--accent); color: var(--on-accent); }
.kpi.orange .lbl, .kpi.orange .foot { color: var(--on-accent); opacity: 0.88; }
.kpi.orange .ic { background: rgba(255, 255, 255, 0.2); }
.kpi.orange .ic svg { stroke: var(--on-accent); }
.kpi.good .ic { background: var(--good-soft); }
.kpi.good .ic svg { stroke: var(--good-ink); }
.kpi.dark { background: var(--tile); color: #fff; }
.kpi.dark .lbl, .kpi.dark .foot { color: #aeaeb2; }
.kpi.dark .ic { background: rgba(255, 255, 255, 0.1); }
.kpi.dark .ic svg { stroke: #fff; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: var(--fill); color: var(--ink2); white-space: nowrap; }
.kpi.orange .chip { background: rgba(255, 255, 255, 0.22); color: var(--on-accent); }
.kpi.dark .chip { background: rgba(255, 255, 255, 0.1); color: #fff; }

/* ---------- status pills (color + icon + label) ---------- */
.pill { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px 0 10px; border-radius: 999px; font-size: 13px; font-weight: 700; white-space: nowrap; }
.pill svg { width: 14px; height: 14px; stroke-width: 2.4; }
.pill.ready { background: var(--good-soft); color: var(--good-ink); }
.pill.warn, .pill.limited { background: var(--warn-soft); color: var(--warn-ink); }
.pill.checking, .pill.connected { background: var(--fill); color: var(--ink2); }
.pill.error { background: var(--red-soft); color: var(--red-ink); }
.pill.nokey, .pill.off, .pill.paid { background: var(--fill); color: var(--ink2); }
.pill.ready .dot { width: 7px; height: 7px; border-radius: 999px; background: currentColor; box-shadow: 0 0 0 0 currentColor; animation: ping 2.4s var(--ease-out) infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(120, 170, 20, 0.45); } 70%, 100% { box-shadow: 0 0 0 6px rgba(120, 170, 20, 0); } }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 42px; padding: 0 20px; border-radius: 999px; border: 0; background: var(--btn-bg); color: var(--btn-fg); font-weight: 700; cursor: pointer; white-space: nowrap; transition: transform 160ms var(--ease-out), background-color 180ms ease, opacity 180ms ease, box-shadow 180ms ease; }
.btn svg { width: 16px; height: 16px; stroke: currentColor; flex-shrink: 0; }
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.55; cursor: default; transform: none; }
.btn.orange { background: var(--accent); color: var(--on-accent); }
.btn.ghost { background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line2); }
.btn.soft { background: var(--fill); color: var(--ink); }
.btn.danger { background: var(--red-soft); color: var(--red-ink); }
.btn.danger-solid { background: var(--red); color: #fff; }
.btn.sm { height: 34px; padding: 0 14px; font-size: 14px; }
.btn.icon { width: 42px; padding: 0; }
.btn.sm.icon { width: 34px; }
@media (hover: hover) {
  .btn.orange:hover { box-shadow: 0 6px 18px rgba(255, 106, 19, 0.28); }
  .btn.ghost:hover, .btn.soft:hover { background: var(--fill-hover); }
}

/* ---------- form fields: always labelled, never shrink below their content ---------- */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span { font-size: 13px; font-weight: 700; color: var(--ink2); padding-left: 4px; }
.field .hint { padding-left: 4px; }
.field input, .field select { width: 100%; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px 16px; }
.form-grid .wide { grid-column: 1 / -1; }
.form-grid.two { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); }
.form-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.form-grid.halves { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 700px) { .form-grid.two, .form-grid.three, .form-grid.halves { grid-template-columns: minmax(0, 1fr); } }
td select { height: 38px; padding-left: 14px; padding-right: 34px; background-position: calc(100% - 18px) 16px, calc(100% - 13px) 16px; }
td.name { min-width: 150px; white-space: nowrap; }
input[type=text], input[type=password], input[type=number], input[type=url], input[type=search], input:not([type]), select, textarea {
  height: 46px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line2); background: var(--input); outline: none; min-width: 0;
  transition: border-color 180ms ease, box-shadow 180ms ease, background-color 180ms ease;
}
input::placeholder, textarea::placeholder { color: var(--ink3); }
textarea { height: auto; border-radius: 20px; padding: 14px 18px; resize: vertical; font-family: var(--mono); font-size: 13px; line-height: 1.55; width: 100%; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-ring); }
select { padding-right: 40px; appearance: none; cursor: pointer; background-image: linear-gradient(45deg, transparent 50%, var(--ink2) 50%), linear-gradient(135deg, var(--ink2) 50%, transparent 50%); background-position: calc(100% - 22px) 20px, calc(100% - 17px) 20px; background-size: 5px 5px; background-repeat: no-repeat; }
.hint { font-size: 13px; color: var(--ink3); font-weight: 400; line-height: 1.45; }

/* dropdown: matches inputs, menu scales in from the button */
.dd { position: relative; display: inline-flex; min-width: 0; max-width: 100%; }
.field .dd { width: 100%; }
.dd-btn { display: inline-flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; height: 46px; padding: 0 14px 0 18px; border-radius: 999px; border: 1px solid var(--line2); background: var(--input); color: var(--ink); cursor: pointer; font-weight: 600; white-space: nowrap; text-align: left; transition: border-color 180ms ease, box-shadow 180ms ease, transform 160ms var(--ease-out); }
.dd-btn:active { transform: scale(0.98); }
.dd-btn svg { width: 16px; height: 16px; color: var(--ink3); flex-shrink: 0; transition: transform 260ms var(--ease-out); }
.dd-txt { overflow: hidden; text-overflow: ellipsis; }
.dd.open .dd-btn { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-ring); }
.dd.open .dd-btn svg { transform: rotate(180deg); color: var(--accent); }
.dd-btn:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-ring); }
@media (hover: hover) { .dd:not(.open) .dd-btn:hover { border-color: var(--ink3); } }
td .dd-btn { height: 38px; padding: 0 12px 0 14px; font-size: 14px; }
.dd-menu { position: fixed; z-index: 90; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 6px; box-shadow: var(--pop); max-height: 320px; overflow: auto; opacity: 0; transform: translateY(-4px) scale(0.97); transform-origin: top left; transition: opacity 140ms ease, transform 200ms var(--ease-out); }
.dd-menu.up { transform: translateY(4px) scale(0.97); transform-origin: bottom left; }
.dd-menu.on { opacity: 1; transform: none; }
.dd-opt { display: flex; align-items: center; justify-content: space-between; gap: 18px; height: 38px; padding: 0 12px 0 14px; border-radius: 13px; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--ink2); white-space: nowrap; transition: background-color 120ms ease, color 120ms ease; }
.dd-opt.act { background: var(--fill); color: var(--ink); }
.dd-opt.on { color: var(--ink); font-weight: 700; }
.dd-opt svg { width: 15px; height: 15px; stroke: var(--accent); stroke-width: 2.4; flex-shrink: 0; }

/* segmented control with a sliding thumb */
.seg { position: relative; align-self: flex-start; display: inline-flex; background: var(--fill); border-radius: 999px; padding: 4px; gap: 2px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg .thumb { position: absolute; top: 4px; bottom: 4px; left: 0; border-radius: 999px; background: var(--seg-on); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12); transition: transform 320ms var(--ease-out), width 320ms var(--ease-out); }
.seg .thumb.instant { transition: none; }
.seg button { position: relative; z-index: 1; border: 0; background: none; height: 34px; padding: 0 16px; border-radius: 999px; font-weight: 700; font-size: 14px; color: var(--ink2); cursor: pointer; transition: color 200ms ease; white-space: nowrap; }
.seg button.on { color: var(--ink); }
.seg button .c { margin-left: 6px; color: var(--ink3); font-weight: 600; }

/* switch: knob stretches while pressed */
.switch { position: relative; display: inline-block; width: 46px; height: 28px; flex-shrink: 0; cursor: pointer; }
.switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line2); transition: background-color 240ms ease; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 999px; background: #fff; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.22); transition: transform 300ms var(--ease-out), width 200ms var(--ease-out); }
.switch:active span::after { width: 28px; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(18px); }
.switch:active input:checked + span::after { transform: translateX(12px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

/* accordion that animates its height */
.acc-btn { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; padding: 6px 4px; font-weight: 700; font-size: 14px; color: var(--ink2); cursor: pointer; border-radius: 999px; }
.acc-btn svg { width: 16px; height: 16px; transition: transform 300ms var(--ease-out); }
.acc-btn[aria-expanded=true] svg { transform: rotate(180deg); }
.acc { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows 340ms var(--ease-out), opacity 240ms ease; }
.acc.open { grid-template-rows: 1fr; opacity: 1; }
.acc > div { overflow: hidden; min-height: 0; }
.acc-inner { padding-top: 16px; }

/* ---------- charts ---------- */
.chart { position: relative; height: 240px; display: grid; grid-template-columns: 48px minmax(0, 1fr); }
.chart .yax { position: relative; }
.chart .yax span { position: absolute; right: 10px; transform: translateY(50%); font-size: 12px; color: var(--ink3); font-variant-numeric: tabular-nums; }
.chart .plot { position: relative; }
.chart .grid-line { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--line2); }
.bars { position: absolute; inset: 0; display: flex; align-items: flex-end; gap: 8px; padding: 0 2px; }
.bar { flex: 1; height: 100%; display: flex; align-items: flex-end; justify-content: center; cursor: default; position: relative; outline-offset: 4px; border-radius: 999px; }
.bar::before { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: min(100%, 26px); transform: translateX(-50%); border-radius: 999px; background: var(--track-bar); }
.bar i { position: relative; display: block; width: 100%; max-width: 26px; border-radius: 999px; background: var(--ink); min-height: 10px; transition: opacity 180ms ease, height 500ms var(--ease-out); }
.bar.today i { background: var(--accent); }
.bar.zero i { background: transparent; }
.bars.grow .bar i { animation: barIn 700ms var(--ease-out) both; animation-delay: calc(var(--i) * 28ms); }
@keyframes barIn { from { clip-path: inset(100% 0 0 0 round 999px); } to { clip-path: inset(0 0 0 0 round 999px); } }
@media (hover: hover) { .bars:hover .bar i { opacity: 0.4; } .bars .bar:hover i { opacity: 1; } }
.xax { display: flex; gap: 8px; padding: 10px 2px 0 50px; }
.xax span { flex: 1; text-align: center; font-size: 12px; color: var(--ink3); white-space: nowrap; overflow: hidden; }
.tip { position: fixed; z-index: 70; pointer-events: none; background: var(--tile-2); color: #fff; border-radius: 16px; padding: 10px 14px; font-size: 13px; line-height: 1.55; box-shadow: 0 12px 34px rgba(0, 0, 0, 0.24); opacity: 0; transform: translateY(6px) scale(0.98); transform-origin: bottom left; transition: opacity 140ms ease, transform 180ms var(--ease-out); font-variant-numeric: tabular-nums; }
.tip.on { opacity: 1; transform: none; }
.tip b { font-weight: 700; }
.share { display: flex; flex-direction: column; gap: 18px; }
.share-row .top-line { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; gap: 8px; }
.share-row .top-line b { font-weight: 700; text-transform: capitalize; }
.track { height: 10px; background: var(--fill); border-radius: 999px; overflow: hidden; }
.track i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width 600ms var(--ease-out); }
.track.warn i { background: var(--warn); }
.track.good i { background: var(--good); }
.track.ink i { background: var(--ink); }
.track.red i { background: var(--red); }
.grow .track i { animation: fillIn 900ms var(--ease-out) both; }
@keyframes fillIn { from { clip-path: inset(0 100% 0 0 round 999px); } to { clip-path: inset(0 0 0 0 round 999px); } }

/* ---------- lists and tables ---------- */
.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 14px; padding: 14px 12px; margin: 0 -12px; border-radius: 18px; transition: background-color 160ms ease; }
.li + .li { border-top: 1px solid var(--line); border-top-left-radius: 0; border-top-right-radius: 0; }
button.li { border: 0; background: none; text-align: left; width: calc(100% + 24px); cursor: pointer; color: inherit; }
@media (hover: hover) { button.li:hover { background: var(--fill); } }
/* provider logos: the brand icon on a white tile, initials until it loads */
.plogo { width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0; display: grid; place-items: center; font-weight: 800; font-size: 13px; text-transform: uppercase; background: var(--tile); color: #fff; overflow: hidden; transition: background-color 200ms ease; }
.plogo.img { background: #fff; box-shadow: inset 0 0 0 1px var(--line); }
.plogo img { width: 66%; height: 66%; object-fit: contain; display: block; animation: logo-in 260ms var(--ease-out); }
.plogo.sm { width: 32px; height: 32px; border-radius: 10px; font-size: 11px; }
.plogo.xs { width: 20px; height: 20px; border-radius: 6px; font-size: 8.5px; }
.plogo.xs img { width: 76%; height: 76%; }
@keyframes logo-in { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: none; } }
.with-logo { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
.opt-brand { display: inline-flex; align-items: center; gap: 10px; }
.src { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; cursor: help; }
.src.arena { background: var(--fill); color: var(--ink); }
.src.mine { background: var(--accent-soft); color: var(--accent-ink); }
.src.est { background: var(--fill); color: var(--ink3); }
.card.bench { display: flex; align-items: center; gap: 16px; padding: 18px 22px; flex-wrap: wrap; }
.bench-ic { width: 40px; height: 40px; border-radius: 12px; background: var(--accent-soft); display: grid; place-items: center; flex-shrink: 0; }
.bench-ic svg { width: 19px; height: 19px; stroke: var(--accent-ink); }
.bench-txt { flex: 1; min-width: 240px; }
.bench-txt b { font-size: 14.5px; }
.bench-link { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; font-size: 13px; color: var(--ink2); text-decoration: none; }
.bench-link svg { width: 14px; height: 14px; }
@media (hover: hover) { .bench-link:hover { color: var(--ink); } }
.bench-links { display: flex; gap: 14px; align-items: center; }
.hint a { display: inline-flex; align-items: center; gap: 3px; }
.hint a svg { width: 13px; height: 13px; flex-shrink: 0; }
/* what KeyRouter set up by itself */
.autobox { border-radius: 20px; background: var(--fill); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.ab-head { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.ab-ic { width: 34px; height: 34px; border-radius: 10px; background: var(--card); display: grid; place-items: center; flex-shrink: 0; }
.ab-ic svg { width: 17px; height: 17px; stroke: var(--accent); }
.ab-t { flex: 1; min-width: 200px; }
.ab-facts { display: flex; gap: 6px; flex-wrap: wrap; }
.autobox .tag:not(.free):not(.paidt) { background: var(--card); }
.ab-log { display: flex; flex-direction: column; gap: 4px; }
.ab-row { display: grid; grid-template-columns: 90px minmax(0, 1fr) auto; gap: 10px; font-size: 13px; color: var(--ink2); }
.ab-row .when { color: var(--ink3); }
/* discover */
.dgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.dcard { display: flex; flex-direction: column; gap: 12px; padding: 20px 22px; }
.dcard.on { box-shadow: inset 0 0 0 2px var(--accent); }
.dc-head { display: flex; align-items: center; gap: 12px; }
.dc-t { flex: 1; min-width: 0; }
.dc-t h3 { font-size: 17px; margin: 0; }
.dc-t .hint { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dc-tag { margin: 0; font-size: 14px; color: var(--ink2); line-height: 1.45; }
.dc-catch { margin: 0; font-size: 13px; color: var(--ink2); line-height: 1.45; padding: 8px 12px; background: var(--fill); border-radius: 12px; }
.dc-catch b { color: var(--ink); font-weight: 700; }
.dc-url { display: flex; align-items: center; gap: 8px; min-width: 0; }
.dc-url > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.dc-src { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 600; color: var(--ink2); text-decoration: none; flex-shrink: 0; }
.dc-src svg { width: 12px; height: 12px; }
@media (hover: hover) { .dc-src:hover { color: var(--accent-ink); } }
.tag.bad { background: var(--red-soft); color: var(--red-ink); }
.dc-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.dc-models { display: flex; flex-direction: column; gap: 4px; border-top: 1px solid var(--line); padding-top: 10px; }
.dc-m { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; min-width: 0; }
.dc-m .mono { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dc-foot { display: flex; align-items: center; gap: 8px; margin-top: auto; }
.dc-foot .sp { flex: 1; }
.tag.new { background: var(--accent); color: var(--on-accent); }
.card.connect.flash { animation: flash 1.2s var(--ease-out); }
@keyframes flash { 0% { box-shadow: 0 0 0 0 rgba(255, 116, 36, 0.55); } 100% { box-shadow: 0 0 0 14px rgba(255, 116, 36, 0); } }
.avatar { width: 40px; height: 40px; border-radius: 999px; flex-shrink: 0; display: grid; place-items: center; font-weight: 800; font-size: 13px; text-transform: uppercase; background: var(--fill); color: var(--ink); }
.avatar.dark { background: var(--tile); color: #fff; }
.li .t { font-weight: 700; }
.li .s { font-size: 13px; color: var(--ink2); }
.li .r { margin-left: auto; text-align: right; flex-shrink: 0; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink3); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; }
.tbl-wrap { overflow-x: auto; }
td:last-child, th:last-child { padding-right: 4px; }
td input[type=number] { width: 84px; height: 36px; padding: 0 12px; }

/* ---------- daily free capacity ---------- */
.capcard { display: flex; flex-direction: column; gap: 14px; }
.capcard .card-head { margin-bottom: 0; }
.cap-ic { width: 38px; height: 38px; border-radius: 999px; display: grid; place-items: center; background: var(--accent-soft); flex-shrink: 0; }
.cap-ic svg { width: 17px; height: 17px; stroke: var(--accent-ink); }
.cap-ic.good { background: var(--good-soft); }
.cap-ic.good svg { stroke: var(--good-ink); }
.cap-big { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.cap-big b { font-family: var(--head); font-size: 40px; font-weight: 700; line-height: 1; letter-spacing: -0.01em; }
.cap-big span { color: var(--ink2); font-size: 14px; font-weight: 600; }
.cap-sub { display: flex; justify-content: space-between; gap: 6px 14px; flex-wrap: wrap; font-size: 13.5px; color: var(--ink2); }
.cap-sub b { color: var(--ink); font-weight: 700; }
.cap-sub .faint { color: var(--ink3); cursor: help; }
.cap-row .v.hit { color: var(--red-ink); font-weight: 700; }
.cap-rows { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); padding-top: 14px; }
.cap-row { display: grid; grid-template-columns: minmax(80px, 130px) minmax(0, 1fr) auto; gap: 12px; align-items: center; font-size: 13px; }
.cap-row .n { font-weight: 700; text-transform: capitalize; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cap-row .v { color: var(--ink2); white-space: nowrap; }
.track.sm { height: 6px; }

/* ---------- models page top ---------- */
.models-top { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); align-items: start; }
.kpi-stack { display: grid; gap: 20px; }
.share.cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px 32px; }
@media (max-width: 1240px) { .share.cols { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.acc-inner.flush { padding-top: 0; }
.detect:empty { display: none; }
@media (max-width: 1240px) { .models-top { grid-template-columns: minmax(0, 1fr); } .kpi-stack { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 700px) { .share.cols, .kpi-row { grid-template-columns: minmax(0, 1fr); } .kpi-stack { grid-template-columns: minmax(0, 1fr); } }

/* ---------- connect a provider ---------- */
.keyless { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-top: 12px; border-top: 1px dashed var(--line2); }
.keyless .btn { text-transform: capitalize; }
/* connect form: key, provider, base URL, button in one row */
.cgrid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 0.85fr) minmax(0, 1.25fr) auto; gap: 12px; align-items: end; }
.cgrid > .btn { height: 46px; padding: 0 24px; }
@media (max-width: 1180px) { .cgrid { grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr) auto; } .cgrid .ckey { grid-column: 1 / -1; } }
@media (max-width: 700px) { .cgrid { grid-template-columns: minmax(0, 1fr); } .cgrid > .btn { width: 100%; } }
.combo { position: relative; }
.combo input { width: 100%; padding-right: 46px; text-transform: lowercase; }
.combo input::placeholder { text-transform: none; }
.combo-btn { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; border: 0; background: none; border-radius: 999px; display: grid; place-items: center; color: var(--ink3); cursor: pointer; }
.combo-btn svg { width: 16px; height: 16px; transition: transform 260ms var(--ease-out); }
.combo.open .combo-btn svg { transform: rotate(180deg); color: var(--accent); }
@media (hover: hover) { .combo-btn:hover { background: var(--fill); } }
.combo-menu .dd-opt { text-transform: capitalize; }
.combo-menu .opt-name span { display: inline-flex; align-items: center; gap: 6px; text-transform: none; }
.combo-menu .opt-name svg { stroke: var(--accent); width: 14px; height: 14px; }
.combo-menu .dd-opt.newopt { color: var(--accent-ink); }
.opt-tags { display: inline-flex; gap: 5px; }
.opt-tags .tagmini { font-size: 11px; font-weight: 700; color: var(--good-ink); background: var(--good-soft); padding: 1px 8px; border-radius: 999px; text-transform: none; }
.opt-tags .tagmini.paid { color: var(--warn-ink); background: var(--warn-soft); }
input[readonly] { background: var(--fill); color: var(--ink2); cursor: default; }
input[readonly]:focus { border-color: var(--line2); box-shadow: none; }
.cinfo { display: flex; align-items: flex-start; gap: 8px; font-size: 13.5px; color: var(--ink3); line-height: 1.45; padding-left: 4px; }
.cinfo svg { width: 15px; height: 15px; flex-shrink: 0; margin-top: 2px; }
.cinfo.ok { color: var(--ink2); }
.cinfo.ok svg { stroke: var(--good-ink); }
.cinfo.bad { color: var(--red-ink); }
.bill-row { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; padding: 4px 0 2px 4px; }
.bill-row .lbl { font-size: 13px; font-weight: 700; color: var(--ink2); }
.cfoot { display: flex; justify-content: space-between; align-items: center; gap: 10px 24px; flex-wrap: wrap; padding-top: 14px; margin-top: 2px; border-top: 1px dashed var(--line2); }
.cfoot .keyless { border-top: 0; padding-top: 0; }
.connect-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; }
.connect-row input { height: 52px; font-size: 15px; padding-left: 22px; }
.connect-row .btn { height: 52px; padding: 0 24px; }
.detect { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-height: 34px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.pchip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line2); background: var(--card); font-weight: 700; font-size: 13.5px; cursor: pointer; color: var(--ink); transition: background-color 160ms ease, border-color 160ms ease, transform 160ms var(--ease-out); text-transform: capitalize; }
.pchip:active { transform: scale(0.97); }
.pchip.on { background: var(--ink); color: var(--card); border-color: var(--ink); }
.pchip .tagmini { font-size: 11px; font-weight: 700; color: var(--good-ink); background: var(--good-soft); padding: 1px 7px; border-radius: 999px; text-transform: none; }
.pchip .tagmini.paid { color: var(--warn-ink); background: var(--warn-soft); }
.pchip.on .tagmini { background: rgba(255, 255, 255, 0.18); color: var(--card); }
@media (hover: hover) { .pchip:not(.on):hover { background: var(--fill); } }
.getkeys { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 13.5px; color: var(--ink3); align-items: center; }
.getkeys a { font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; gap: 3px; text-transform: capitalize; }
.getkeys a svg { width: 13px; height: 13px; }
@media (hover: hover) { .getkeys a:hover { text-decoration: underline; } }
.custom-box { background: var(--fill); border-radius: 22px; padding: 18px; }

/* ---------- provider cards: one row each, details fold open ---------- */
.ptools { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 32px 0 14px; padding: 0 4px; flex-wrap: wrap; }
.search { position: relative; display: block; width: min(320px, 100%); }
.search svg { position: absolute; left: 16px; top: 50%; width: 17px; height: 17px; transform: translateY(-50%); color: var(--ink3); pointer-events: none; }
.search input { width: 100%; height: 42px; padding-left: 44px; }
.plist { display: flex; flex-direction: column; gap: 12px; }
.pcard { display: flex; flex-direction: column; padding: 0; container-type: inline-size; transition: box-shadow 240ms ease; }
.pcard.open { box-shadow: var(--pop); }
@container (max-width: 600px) { .pcard .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@container (max-width: 640px) { .pcard .pmini { display: none; } }
.pcard .ph { width: 100%; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; padding: 16px 18px 16px 20px; border-radius: 26px; transition: background-color 160ms ease; }
@media (hover: hover) { .pcard:not(.open) .ph:hover { background: var(--fill); } }
.pcard .ph:focus-visible { outline-offset: -2px; }
.pmini { display: flex; gap: 6px; flex-shrink: 0; }
.pmini .tag { margin: 0; }
.chev { width: 34px; height: 34px; border-radius: 999px; display: grid; place-items: center; background: var(--fill); flex-shrink: 0; }
.chev svg { width: 16px; height: 16px; transition: transform 300ms var(--ease-out); }
.pcard.open .chev svg { transform: rotate(180deg); }
.fold { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows 380ms var(--ease-out), opacity 260ms ease; }
.fold.open { grid-template-rows: 1fr; opacity: 1; }
.fold > div { overflow: hidden; min-height: 0; }
.pinner { display: flex; flex-direction: column; gap: 18px; padding: 4px 22px 22px; }
.pcard.new { animation: glow 1600ms var(--ease-out); }
@keyframes glow { 0% { box-shadow: 0 0 0 0 rgba(255, 106, 19, 0.55), var(--shadow); } 100% { box-shadow: 0 0 0 14px rgba(255, 106, 19, 0), var(--shadow); } }
.ph { display: flex; align-items: center; gap: 14px; }
.ph h3 { font-size: 19px; text-transform: capitalize; }
.ph .url { font-size: 13px; color: var(--ink3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 14px 18px; background: var(--fill); border-radius: 22px; }
.toggle-row b { display: block; }
.ph .ttl { min-width: 0; flex: 1; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(108px, 1fr)); gap: 10px; }

.stat.good { background: var(--good-soft); }

@media (hover: hover) { button.stat:hover { background: var(--fill-hover); } button.stat.good:hover { background: var(--good-soft); filter: brightness(0.97); } }
.note { display: flex; align-items: center; gap: 10px; font-size: 14px; padding: 12px 16px; border-radius: 20px; background: var(--fill); }
.note svg { width: 16px; height: 16px; flex-shrink: 0; }

.note.bad { background: var(--red-soft); color: var(--red-ink); }

.note.ok .when, .note.bad .when { color: inherit; opacity: 0.7; }
.keybox { border: 1px solid var(--line); border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.kh { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.kh .mono { font-size: 13.5px; font-weight: 600; }
.kh .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; align-items: center; }
.meters { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px 20px; }
.meter-lbl { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink2); margin-bottom: 7px; gap: 8px; white-space: nowrap; }

.addkey { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; }
.pfoot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 16px; }

.empty { text-align: center; padding: 40px 20px; color: var(--ink2); }
.empty .big-ic { width: 60px; height: 60px; border-radius: 999px; background: var(--accent-soft); display: grid; place-items: center; margin: 0 auto 14px; }
.empty .big-ic svg { width: 26px; height: 26px; stroke: var(--accent); }
.empty h3 { color: var(--ink); margin: 0 0 8px; font-size: 22px; }
.empty p { max-width: 460px; margin: 0 auto 20px; }
.reveal { background: var(--tile); color: #fff; border-radius: 22px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; animation: rise 420ms var(--ease-out); }
.reveal code { font-family: var(--mono); font-size: 13.5px; word-break: break-all; color: var(--accent); }
.out { background: var(--fill); border-radius: 20px; padding: 16px 18px; white-space: pre-wrap; font-size: 15px; max-height: 380px; overflow: auto; }
.tag { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--fill); color: var(--ink2); margin: 2px 4px 2px 0; white-space: nowrap; }
.tag.free { background: var(--good-soft); color: var(--good-ink); }
.tag.paidt { background: var(--warn-soft); color: var(--warn-ink); }
.tag.credit { background: var(--tile); color: #fff; }
.meters.wide { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); padding: 0 2px; }
.rank { width: 24px; height: 24px; border-radius: 999px; display: inline-grid; place-items: center; font-size: 12px; font-weight: 800; background: var(--card); flex-shrink: 0; }
.rank.first { background: var(--accent); color: var(--on-accent); }
.pick { background: var(--fill); border-radius: 22px; padding: 16px; }
.pick-title { font-weight: 700; margin-bottom: 12px; }
.paidbox { display: flex; align-items: center; gap: 14px; padding: 14px 18px; background: var(--fill); border-radius: 22px; }

/* ---------- sheet ---------- */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; opacity: 0; transition: opacity 280ms ease; }
.scrim.on { opacity: 1; }
.sheet { position: fixed; top: 12px; right: 12px; bottom: 12px; width: min(640px, calc(100vw - 24px)); background: var(--bg); border-radius: 30px; z-index: 41; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; transform: translateX(calc(100% + 24px)); transition: transform 460ms var(--ease-drawer); }
.sheet.on { transform: none; }
.sheet-head { padding: 26px 26px 16px; display: flex; flex-direction: column; gap: 14px; }
.sheet-head h2 { margin: 0; font-size: 26px; text-transform: capitalize; }
.sheet-body { padding: 0 26px 26px; overflow: auto; flex: 1; }

/* ---------- modal ---------- */
.modal-wrap { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; }
.modal-wrap .scrim { position: absolute; z-index: 0; }
.modal { position: relative; z-index: 1; width: min(440px, 100%); background: var(--card); border-radius: 28px; padding: 28px; box-shadow: var(--shadow-lg); opacity: 0; transform: scale(0.95) translateY(8px); transition: opacity 200ms ease, transform 280ms var(--ease-out); }
.modal.on { opacity: 1; transform: none; }
.modal .mic { width: 48px; height: 48px; border-radius: 999px; display: grid; place-items: center; background: var(--red-soft); margin-bottom: 16px; }
.modal .mic svg { width: 22px; height: 22px; stroke: var(--red-ink); }
.modal h2 { margin: 0 0 8px; font-size: 24px; }
.modal p { margin: 0 0 24px; color: var(--ink2); }
.modal .row { justify-content: flex-end; }

/* ---------- login ---------- */
.login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
.login { width: 400px; max-width: 100%; background: var(--card); border-radius: 32px; padding: 40px 32px 32px; box-shadow: var(--shadow); text-align: center; animation: rise 500ms var(--ease-out); }
.login .logo { width: 56px; height: 56px; border-radius: 18px; margin: 0 auto 18px; }
.login .logo svg { width: 28px; height: 28px; }
.login h1 { margin: 0; font-size: 32px; }
.login p { margin: 8px 0 24px; }
.login form { display: flex; flex-direction: column; gap: 10px; }
.login input { height: 52px; text-align: center; }
.login .btn { height: 52px; }
.theme-fab { position: fixed; top: 16px; right: 16px; z-index: 5; }

/* ---------- toasts ---------- */
#toasts { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 80; align-items: center; pointer-events: none; }
.toast { display: flex; align-items: center; gap: 10px; background: var(--tile-2); color: #fff; padding: 12px 20px 12px 14px; border-radius: 999px; font-weight: 600; box-shadow: 0 12px 34px rgba(0, 0, 0, 0.24); animation: toastIn 420ms var(--ease-out); max-width: min(92vw, 560px); }
.toast svg { width: 18px; height: 18px; flex-shrink: 0; stroke: var(--good); }
.toast.bad svg { stroke: #ffb4b0; }
.toast.out { animation: toastOut 220ms ease forwards; }
@keyframes toastIn { from { opacity: 0; transform: translateY(14px) scale(0.96); } to { opacity: 1; transform: none; } }
@keyframes toastOut { to { opacity: 0; transform: translateY(8px) scale(0.97); } }
.spin { width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 999px; animation: spin 700ms linear infinite; display: inline-block; flex-shrink: 0; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- responsive ---------- */
@media (max-width: 1240px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g21, .g3 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 1100px) { .g2.providers { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 860px) {
  .shell { display: block; }
  .side { position: fixed; z-index: 30; top: auto; bottom: 12px; left: 12px; right: 12px; height: 64px; padding: 8px; flex-direction: row; justify-content: space-between; align-items: center; gap: 2px; border-radius: 999px; border: 1px solid var(--line); box-shadow: var(--shadow-lg); }
  .side .brand, .side .grow, .side-foot { display: none; }
  .shell.mini .nav-btn:not(.on) { box-shadow: none; }
  .nav-btn { width: 46px; height: 46px; min-height: 46px; padding: 0; justify-content: center; flex-shrink: 0; }
  .rtip { display: none; }
  .nav-btn span { display: none; }
  .mtop { display: flex; align-items: center; gap: 10px; padding: 16px 16px 0; font-family: var(--head); font-weight: 700; font-size: 20px; }
  .mtop .sp { flex: 1; }
  .main { padding: 20px 16px 110px; }
  .top { flex-direction: column; align-items: flex-start; }
  .top h1 { font-size: 30px; }
  .g2, .g4 { grid-template-columns: minmax(0, 1fr); }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .card { padding: 20px; border-radius: 24px; }
  .connect-row { grid-template-columns: minmax(0, 1fr); }
  .kpi { min-height: 132px; }
  .kpi .big { font-size: 34px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
/* ---------- settings: appearance, alerts ---------- */
.hide { display: none !important; }
.grow1 { flex: 1; min-width: 0; }
.th-sub { font-size: 11px; font-weight: 600; color: var(--ink3); text-transform: none; letter-spacing: 0; }
.set-ic { width: 38px; height: 38px; border-radius: 999px; background: var(--accent-soft); display: grid; place-items: center; flex-shrink: 0; }
.set-ic svg { width: 17px; height: 17px; stroke: var(--accent-ink); }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.swatch { width: 40px; height: 40px; border-radius: 999px; border: 0; cursor: pointer; display: grid; place-items: center; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.08); transition: transform 160ms var(--ease-out), box-shadow 160ms ease; }
.swatch svg { width: 17px; height: 17px; stroke: #fff; stroke-width: 3; opacity: 0; transform: scale(0.6); transition: opacity 140ms ease, transform 180ms var(--ease-out); filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.35)); }
.swatch.on { box-shadow: 0 0 0 3px var(--card), 0 0 0 5px var(--ink); }

@media (hover: hover) { .swatch:hover { transform: scale(1.08); } }
.swatch:active { transform: scale(0.95); }
.wheel-wrap { position: relative; display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 16px 0 6px; border-radius: 999px; background: var(--fill); font-weight: 600; font-size: 14px; cursor: pointer; flex-shrink: 0; }
.wheel-wrap::before { content: ""; width: 32px; height: 32px; border-radius: 999px; background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red); box-shadow: inset 0 0 0 2px var(--card); }
.wheel { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
.wheel-wrap:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
input.hexin { width: 110px; text-transform: lowercase; }
.acc-preview { display: flex; align-items: center; flex-wrap: wrap; gap: 14px; padding: 14px 16px; border-radius: 20px; background: var(--fill); }
.acc-preview .btn { pointer-events: none; }

.alert-evs { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
.alert-evs .paidbox { padding: 12px 16px; }
/* ---------- needs a look ---------- */
.attn-row { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-top: 1px solid var(--line); font-size: 14px; }
.attn-row:first-child { border-top: 0; }
.attn-ic { width: 32px; height: 32px; border-radius: 999px; background: var(--warn-soft); display: grid; place-items: center; flex-shrink: 0; }
.attn-ic svg { width: 15px; height: 15px; stroke: var(--warn-ink); }
/* ---------- provider health strip ---------- */
.hstrip { display: flex; gap: 3px; align-items: center; }
.hcell { display: inline-block; width: 12px; height: 22px; border-radius: 4px; background: var(--fill); flex-shrink: 0; }
.hcell.good { background: var(--good); }
.hcell.warn { background: var(--warn); }
.hcell.bad { background: var(--red); }
.hcell.none { background: var(--fill); box-shadow: inset 0 0 0 1px var(--line2); }
.hpct { font-weight: 700; }
.hpct.good { color: var(--good-ink); }
.hpct.warn { color: var(--warn-ink); }
.hpct.bad { color: var(--red-ink); }
.hlegend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 14px; font-size: 12.5px; color: var(--ink2); }
.hlegend span { display: inline-flex; align-items: center; gap: 6px; }
.hlegend .hcell { width: 10px; height: 10px; border-radius: 3px; }
table.health td { vertical-align: middle; }

/* ---------- calm pass: fewer badges, aligned figures, Apple-like hierarchy ---------- */
/* Status: a colored dot and a word, no filled badge. */
.pill { height: auto; padding: 0; background: none !important; gap: 7px; font-size: 13.5px; font-weight: 600; color: var(--ink2); }
.pill .dot { width: 8px; height: 8px; border-radius: 999px; background: var(--ink3); flex-shrink: 0; animation: none !important; box-shadow: none !important; }
.pill.ready { color: var(--ink); }
.pill.ready .dot { background: var(--good); }
.pill.connected .dot, .pill.checking .dot { background: var(--ink3); }
.pill.warn, .pill.limited { color: var(--warn-ink); }
.pill.warn .dot, .pill.limited .dot { background: var(--warn); }
.pill.error { color: var(--red-ink); }
.pill.error .dot { background: var(--red); }

/* Table headers in sentence case, like the rest of the type. */
th { text-transform: none; letter-spacing: 0; font-size: 12.5px; font-weight: 600; }

/* KPI tiles: every caption on one line, so the big numbers line up. */
.g4 .kpi .foot, .kpi-row .kpi .foot { flex-wrap: nowrap; white-space: nowrap; overflow: hidden; min-height: 26px; }
.bar::before { opacity: 0.55; }

/* Overview: API keys */
.krows { display: flex; flex-direction: column; }
.krow { display: grid; grid-template-columns: 40px minmax(140px, 1.1fr) minmax(120px, 2fr) 120px 130px; align-items: center; gap: 18px; padding: 14px 0; border-top: 1px solid var(--line); }
.krow-t { min-width: 0; }
.krow-t .t { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.krow .s { font-size: 13px; color: var(--ink2); }
.krow-m .track { height: 8px; }
.krow-n { text-align: right; font-size: 13.5px; color: var(--ink3); white-space: nowrap; }
.krow-n b { color: var(--ink); font-weight: 700; }
@media (max-width: 860px) { .krow { grid-template-columns: 40px minmax(0, 1fr) auto; } .krow-m, .krow-n:last-child { display: none; } }

/* Overview: provider health as a grouped list in columns */
.hgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); column-gap: 32px; }
.hrow { display: flex; align-items: center; gap: 12px; min-width: 0; padding: 12px 6px; border: 0; border-top: 1px solid var(--line); background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; transition: background-color 160ms ease; }
@media (hover: hover) { .hrow:hover { background: var(--fill); } }
.hrow-t { flex: 1; min-width: 0; }
.hrow .t { font-weight: 700; }
.hrow .s { font-size: 13px; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hrow .pill { flex-shrink: 0; }

/* Providers: quiet figures in fixed columns, so every row lines up */
.pmini { gap: 4px; align-items: center; }
.pfig { display: flex; flex-direction: column; align-items: flex-end; min-width: 66px; line-height: 1.15; }
.pfig b { font-size: 15px; font-weight: 700; color: var(--ink); }

.pstat { width: 132px; flex-shrink: 0; display: flex; padding-left: 24px; }

.ph h3 { font-size: 17px; }
.ph .ttl { flex: 1; min-width: 0; }
@container (max-width: 640px) { .pstat { width: auto; padding-left: 8px; } }

/* Connect a provider */
.connect .card-head { align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
.getkeys { font-size: 13px; color: var(--ink3); gap: 4px 14px; }
.getkeys a { font-weight: 600; color: var(--ink2); text-transform: none; }
@media (hover: hover) { .getkeys a:hover { color: var(--accent-ink); text-decoration: none; } }
.cbody { display: flex; flex-direction: column; gap: 12px; }
.cinfo.hide { display: none; }

.copts .seg { padding: 6px; }
.copts-hint { padding: 8px 4px 2px; }
@media (max-width: 700px) { .copts { grid-template-columns: minmax(0, 1fr); } }
.cfoot { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 0; }

/* Models */
.price { font-size: 13.5px; font-weight: 600; white-space: nowrap; }
.price.free { color: var(--good-ink); }
.price.paid { color: var(--ink2); }
.price.credit { color: var(--accent-ink); }
.goodat { display: block; max-width: 260px; font-size: 13.5px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mtable td { padding-top: 14px; padding-bottom: 14px; }
.src { background: none !important; padding: 0; font-weight: 600; color: var(--ink3); }
.src.arena { color: var(--ink2); }
.src.mine { color: var(--accent-ink); }
.pick-prov { font-size: 12.5px; font-weight: 600; color: var(--ink3); white-space: nowrap; }
.pick-prov.paid { color: var(--warn-ink); }

/* Agent keys table: inputs sized to their numbers */
.ktable td { padding-left: 10px; padding-right: 10px; }
.ktable input { width: 96px; height: 38px; padding: 0 12px; }
.ktable td { white-space: nowrap; }
.ktable td.name { min-width: 130px; }

/* Discover: a pitch, three facts, then only what matters */
.dsrc { font-size: 13px; color: var(--ink2); margin: -4px 4px 16px; }
.dsrc a { color: var(--ink); font-weight: 600; text-decoration: none; }
@media (hover: hover) { .dsrc a:hover { text-decoration: underline; } }
.dgrid { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.dcard { gap: 14px; padding: 22px; }
.dc-t h3 { display: flex; align-items: center; gap: 8px; font-size: 17px; }
.dc-url { font-size: 12.5px; color: var(--ink3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
.dc-new { font-family: var(--font); font-size: 11px; font-weight: 700; color: var(--accent-ink); background: var(--accent-soft); padding: 1px 8px; border-radius: 999px; }

.dfact { display: flex; flex-direction: column; gap: 2px; min-width: 0; padding: 0 12px; border-left: 1px solid var(--line); }

.dfact span { font-size: 11.5px; font-weight: 600; color: var(--ink3); }

.dline { display: flex; gap: 10px; font-size: 13px; min-width: 0; margin-top: -6px; }
.dfacts + .dline { margin-top: 0; }
.dline span { width: 72px; flex-shrink: 0; color: var(--ink3); }

.dc-foot { gap: 12px; padding-top: 2px; }
.dc-link { white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 700; color: var(--ink); text-decoration: none; }

.dc-src { font-size: 12.5px; color: var(--ink3); }
@media (hover: hover) { .dc-link:hover { color: var(--accent-ink); } }

/* Sidebar: the page list scrolls on short screens, so Lock is always reachable */
.side-nav { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
.side-nav::-webkit-scrollbar { display: none; }
@media (max-height: 820px) {
  .side { padding-top: 18px; padding-bottom: 14px; }
  .nav-btn { height: 42px; min-height: 42px; }

  .side-mode { padding: 9px 14px; margin-bottom: 4px; }
  .brand { height: 50px; }
  .shell.mini .brand { height: 96px; }
}
@media (max-height: 640px) { .side-mode { display: none; } }
/* Phones: the page list is the floating tab bar */
@media (max-width: 860px) {
  .side { padding: 8px; }
  .side-nav { flex-direction: row; justify-content: space-between; align-items: center; gap: 2px; overflow: visible; width: 100%; }
  .nav-btn { height: 46px; min-height: 46px; }
}

/* Light and dark: a short cross-fade instead of a jump */
::view-transition-old(root), ::view-transition-new(root) { animation-duration: 380ms; animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
html.theming, html.theming *, html.theming *::before, html.theming *::after { transition: background-color 380ms ease, color 380ms ease, border-color 380ms ease, fill 380ms ease, stroke 380ms ease, box-shadow 380ms ease !important; }
